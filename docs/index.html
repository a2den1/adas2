<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adas2</title>
<link rel="icon" href="../docs/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="../dist/adas2.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #121110; font-family: var(--a2-font); overflow: hidden; transition: background-color .3s; }
  html[data-a2-theme="light"] body { background: #E6DFD7; }
  html[data-a2-theme="ocean"] body { background: #0D1015; }
  #desk { position: fixed; inset: 0; }
  .hint { position: fixed; left: 16px; bottom: 12px; font: 300 12px var(--a2-font); color: rgba(255,255,255,.35); pointer-events: none; }
  html[data-a2-theme="light"] .hint { color: rgba(0,0,0,.4); }
  .pages { position: relative; overflow: hidden; }
  .pages > .a2-stack { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="desk"></div>
<div class="hint">Alt + ` : 창 보이기/숨기기</div>

<script src="../dist/adas2.js"></script>
<script>
const { Factory: F, Theme, WindowManager, ShortcutManager, KeyCombo, switchPage } = adas2;
adas2.configure({ config: { uiScale: 0.6 }, theme: Theme.Dark });

const windows = WindowManager.create('#desk');
const vw = innerWidth || 1280, vh = innerHeight || 800;
const small = vw < 760;
const main = windows.create({
  title: 'adas2', icon: '<img src="../docs/logo.svg" alt="">', iconSize: 36,
  size: small ? [Math.floor((vw - 16) / 0.6), Math.floor((vh - 16) / 0.6)] : [900, Math.min(1300, Math.floor((vh - 40) / 0.6))],
  resizable: !small, minSize: [600, 600], clipContent: true, padding: 0,
});
main.on('closeRequested', w => w.hide());
// 화면 크기에 맞추기: 좁으면 화면을 꽉 채우고, 넓으면 높이만 화면 안으로
function fit() {
  const s = adas2.context.config.uiScale, W = innerWidth, H = innerHeight;
  if (!W || !H) return;
  if (W < 760) main.setSize(Math.floor((W - 16) / s), Math.floor((H - 16) / s));
  else main.setSize(Math.max(main.w, 600), Math.min(1300, Math.floor((H - 40) / s)));
  main.setPosition(null);
}
addEventListener('resize', fit);
requestAnimationFrame(fit);

const scroll = F.scrollView(main, { spacing: 12, padding: 16, expand: true });
const C = scroll.content;

// ── 테마
const themeCard = F.card(C, { title: '테마', showActiveToggle: false, showDelete: false });
F.segmented(themeCard, 'theme', {
  values: ['dark', 'light', 'ocean'], value: 'dark', defaultValue: 'dark',
  display: v => ({ dark: 'Dark', light: 'Light', ocean: 'Ocean' })[v],
  onChanged: v => adas2.setTheme({ dark: Theme.Dark, light: Theme.Light, ocean: Theme.Ocean }[v]),
});
F.slider(themeCard, 'scale', {
  label: 'UI 배율', min: 0.4, max: 1, value: 0.6, defaultValue: 0.6, format: 2,
  onComplete: v => adas2.setConfig({ uiScale: v }),
});
F.slider(themeCard, 'speed', {
  label: '애니메이션 속도', min: 0, max: 3, value: 1, defaultValue: 1, format: 2,
  onChanged: v => adas2.setConfig({ animationSpeed: v }),
});

// ── 기본 컨트롤
const basic = F.card(C, { title: '기본 컨트롤', onDelete: card => card.el.remove() });
const row = F.row(basic);
F.button(row, () => counter.text = `눌림 ${++count}`, '버튼', 'btn_hello');
const counter = F.button(row, 'btn_count', { text: '눌림 0', onClick: () => counter.text = `눌림 ${++count}` });
let count = 0;
F.toggle(basic, 'notify', { text: '알림 받기', value: true, defaultValue: true, tooltip: '가운데 버튼으로 누르면 기본값으로 돌아갑니다' });
F.slider(basic, 'volume', { label: '음량', min: 0, max: 100, value: 70, defaultValue: 70, format: 0,
  tooltip: '끌어서 바꾸거나, 눌러서 값을 입력합니다.\n계산식도 됩니다: 50+25, x*2, sqrt(2)*10' });
F.slider(basic, 'offset', { label: '오프셋', min: -1, max: 1, value: 0, defaultValue: 0, format: 3, clampInput: true });
F.input(basic, 'name', { placeholder: '이름', icon: 'fa-solid fa-pen', defaultValue: '' });
F.input(basic, 'memo', { placeholder: '여러 줄 메모', multiline: true });

// ── 고르기
const pick = F.card(C, { title: '고르기' });
F.segmented(pick, 'align', { values: ['왼쪽', '가운데', '오른쪽'], value: '가운데', defaultValue: '가운데' });
F.dropdown(pick, 'quality', { values: ['낮음', '보통', '높음', '최고'], value: '보통', defaultValue: '보통' });
F.multiDropdown(pick, 'layers', { values: ['배경', '캐릭터', '효과', 'UI'], value: ['배경', 'UI'], defaultValue: ['배경', 'UI'] });
F.colorPicker(pick, 'accent', { label: '강조색', value: '#FF8A55', defaultValue: '#FF8A55' });

// ── 페이지 전환
const pg = F.card(C, { title: '페이지 전환' });
const pagesBox = F.stack(pg); pagesBox.classList.add('pages'); pagesBox.style.height = 'calc(var(--a2-px) * 170)';
const pages = new Map();
['첫 번째', '두 번째', '세 번째'].forEach((name, i) => {
  const p = F.stack(pagesBox);
  F.text(p, `${name} 페이지`, { h1: true });
  F.text(p, '오른쪽에서 들어오고, 지금 페이지는 왼쪽으로 나갑니다.', { dim: true });
  if (i) p.hidden = true;
  pages.set(i, p);
});
let page = 0;
F.segmented(pg, 'page', { values: [0, 1, 2], value: 0, display: v => `${v + 1}`, onChanged: v => { switchPage(pages, page, v); page = v; } });

// ── 창
const winCard = F.card(C, { title: '창' });
let sub = null;
F.button(winCard, () => {
  if (sub && sub.visible) { sub.bringToFront(); return; }
  if (!sub) {
    sub = windows.create({ title: '새 창', size: [620, 520], position: [small ? 0 : 360, small ? 0 : -120], resizable: true, minSize: [420, 360] });
    sub.on('closeRequested', w => w.hide());
    F.text(sub, '위쪽 막대를 끌어 옮기고, 가장자리를 끌어 크기를 바꿉니다.', { dim: true });
    F.toggle(sub, null, { text: '항상 위', value: false });
    F.button(sub, () => sub.hide(), '닫기');
  }
  sub.show();
}, '새 창 열기');
F.text(winCard, '닫기 버튼은 closeRequested 이벤트만 보냅니다. 숨길지 지울지는 쓰는 쪽이 정합니다.', { dim: true });

// ── 단축키: Alt+` 로 메인 창 보이기/숨기기, 0.6초 누르고 있으면 가운데로
ShortcutManager.register('toggle', new KeyCombo('Backquote', 'Alt'), 0.6, {
  onPressed: () => (main.visible ? main.hide() : main.show()),
  onHeld: () => { main.show(); main.setPosition(null); },
});
</script>
</body>
</html>
