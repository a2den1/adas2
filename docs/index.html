<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adas2</title>
<link rel="icon" href="../docs/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="../dist/adas2.css">
<style>
  html { background: var(--a2-bg); color-scheme: dark; scrollbar-gutter: stable; }
  html[data-a2-theme="light"] { color-scheme: light; }
  body { margin: 0; background: var(--a2-bg); transition: background-color .3s; }
  .page { max-width: 1120px; margin: 0 auto; padding: 40px 24px 120px; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; flex-wrap: wrap; }
  .top img { width: 40px; height: 40px; }
  .top h1 { margin: 0; font: 500 26px var(--a2-font); letter-spacing: -.02em; color: var(--a2-text); padding-top: 3px; }
  .top .theme { margin-left: auto; width: 300px; max-width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px; align-items: start; }
  .card { background: var(--a2-raised); border-radius: 22px; padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card.wide { grid-column: 1 / -1; }
  .card > h3 { margin: 0 0 2px; font: 500 15px var(--a2-font); color: var(--a2-text-muted); letter-spacing: -.01em; }
  .card .a2-switch, .card .a2-check, .card .a2-stepper, .card .a2-keybind, .card .a2-radio-list { margin-left: -8px; margin-right: -8px; padding-left: 8px; padding-right: 8px; }
  .menu-target { display: grid; place-items: center; height: 96px; border-radius: 14px; background: var(--a2-surface); color: var(--a2-text-muted); font: 300 14px var(--a2-font); -webkit-user-select: none; user-select: none; }
  @media (max-width: 720px) { .page { padding: 24px 16px 80px; } .top .theme { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="page a2">
  <div class="top">
    <img src="../docs/logo.svg" alt="">
    <h1>adas2</h1>
    <div class="theme" id="theme"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script src="../dist/adas2.js"></script>
<script>
const { ui, panel, toast, confirm, alert, menu } = adas2;
adas2.setup({ theme: 'dark', scale: 0.62 });

ui('#theme').segmented([{ value: 'dark', label: 'Dark' }, { value: 'light', label: 'Light' }, { value: 'ocean', label: 'Ocean' }],
  { value: 'dark', onChange: v => adas2.setTheme(v) });

const grid = document.getElementById('grid');
const card = (title, fill, wide) => {
  const c = document.createElement('div'); c.className = 'card' + (wide ? ' wide' : '');
  if (title) { const t = document.createElement('h3'); t.textContent = title; c.append(t); }
  grid.append(c); fill(ui(c)); return c;
};

card('버튼', u => {
  u.row(r => {
    r.button('저장', () => toast('저장했어요', { type: 'success' }));
    r.button({ text: '취소', variant: 'soft' });
  });
  u.row(r => {
    r.button({ text: '더 보기', variant: 'ghost', icon: 'fa-solid fa-ellipsis' });
    const load = r.button({ text: '불러오기', variant: 'primary', icon: 'fa-solid fa-rotate' });
    load.on('click', () => { load.setLoading(true); setTimeout(() => load.setLoading(false), 1400); });
  });
});

card('켜고 끄기', u => {
  u.switch('알림 받기', { value: true, default: true, description: '새 소식이 오면 알려 줘요' });
  u.switch('자동 저장', { value: false, default: false });
  u.checkbox('이용 약관에 동의', { value: true });
  u.checkbox('광고 메일 받기', { value: false, default: false });
});

card('슬라이더', u => {
  u.slider('음량', { id: 'volume', min: 0, max: 100, value: 70, default: 70, unit: '%',
    tooltip: '누르거나 끌어서 바꿔요.\n숫자를 누르면 직접 입력할 수 있고, 50+25 · x*2 같은 계산식도 돼요.' });
  u.slider('밝기', { min: 0, max: 1, step: 0.01, value: 0.45, default: 0.5 });
  u.stepper('수량', { id: 'qty', min: 1, max: 20, value: 3, default: 1 });
});

card('입력', u => {
  u.field('이름', { placeholder: '홍길동', icon: 'fa-solid fa-user' });
  u.field('메모', { placeholder: '여러 줄 입력', multiline: true, maxLength: 200 });
});

card('고르기', u => {
  u.select('품질', ['낮음', '보통', '높음', '최고'], { id: 'quality', value: '보통', default: '보통' });
  u.multiSelect('레이어', ['배경', '캐릭터', '효과', 'UI', '자막'], { id: 'layers', value: ['배경', 'UI'], default: ['배경', 'UI'] });
  u.segmented(['왼쪽', '가운데', '오른쪽'], { id: 'align', value: '가운데', label: '정렬', default: '가운데' });
  u.color('강조색', { id: 'accent', value: '#FF7A45', default: '#FF7A45' });
});

card('라디오', u => {
  u.radio('정렬 기준', [
    { value: 'name', label: '이름', description: '가나다 순' },
    { value: 'date', label: '날짜', description: '최근 것부터' },
    { value: 'size', label: '크기' },
  ], { value: 'date', default: 'date' });
});

card('단축키', u => {
  u.keybind('패널 열기·닫기', { id: 'kb', value: 'Alt+Backquote', default: 'Alt+Backquote', onPress: () => mainPanel.toggle(),
    description: '눌러서 새 키 조합을 입력해요. Esc 취소, Backspace 지우기' });
  u.keybind('스크린샷', { value: 'Ctrl+Shift+KeyS' });
});

card('진행', u => {
  const p = u.progress('내려받기', { value: 0.35, showValue: true });
  setInterval(() => p.set(p.value >= 1 ? 0 : Math.min(1, p.value + 0.13)), 1300);
  u.progress('준비 중', { value: null });
  u.row(r => { r.spinner(); r.spinner({ size: 24 }); r.text('불러오는 중', { muted: true, small: true }); });
});

card('알림·대화상자', u => {
  u.row(r => {
    r.button({ text: '토스트', variant: 'soft', onClick: () => toast('설정을 저장했어요', { type: 'success' }) });
    r.button({ text: '되돌리기', variant: 'soft', onClick: () => toast('항목 3개를 지웠어요', { action: { label: '되돌리기', onClick: () => toast('되돌렸어요') } }) });
  });
  u.row(r => {
    r.button({ text: '확인 창', variant: 'soft', onClick: async () => { const ok = await confirm('이 항목을 지울까요? 되돌릴 수 없어요.', { title: '지우기', ok: '지우기', danger: true }); toast(ok ? '지웠어요' : '취소했어요', { type: ok ? 'error' : 'info' }); } });
    r.button({ text: '알림 창', variant: 'soft', onClick: () => alert('업데이트를 마쳤어요.', { title: '완료' }) });
  });
});

card('오른쪽 클릭 메뉴', u => {
  const t = document.createElement('div'); t.className = 'menu-target'; t.textContent = '여기서 오른쪽 클릭';
  u.host.append(t);
  menu(t, [
    { label: '복사', icon: 'fa-regular fa-copy', shortcut: 'Ctrl+C', onSelect: () => toast('복사했어요') },
    { label: '붙여넣기', icon: 'fa-regular fa-paste', shortcut: 'Ctrl+V', disabled: true },
    '-',
    { label: '이름 바꾸기', icon: 'fa-regular fa-pen-to-square', onSelect: () => toast('이름 바꾸기') },
    { label: '지우기', icon: 'fa-regular fa-trash-can', danger: true, onSelect: () => toast('지웠어요', { type: 'error' }) },
  ]);
});

card('탭', u => {
  u.tabs([
    { label: '일반', build: t => { t.switch('시작할 때 열기', { value: true }); t.select('언어', ['한국어', 'English', '日本語'], { value: '한국어' }); } },
    { label: '화면', build: t => { t.slider('글자 크기', { min: 12, max: 24, value: 16, unit: 'px' }); t.segmented(['작게', '보통', '크게'], { value: '보통' }); } },
    { label: '정보', build: t => { t.text('adas2 · 웹용 UI 툴킷'); t.text('버전 ' + adas2.version, { muted: true, small: true }); } },
  ], { id: 'tabs' });
}, true);

card('섹션·패널', u => {
  u.section('효과', { id: 'fx', toggle: true, collapsible: true, description: '끄면 아래 설정이 흐려져요' }, s => {
    s.slider('세기', { min: 0, max: 10, value: 6, step: 1 });
    s.switch('반짝임', { value: false });
  });
  u.button({ text: '패널 열기', variant: 'soft', onClick: () => mainPanel.show() });
});

// 패널: 위쪽을 끌어 옮기고, 가장자리로 크기 조절. 닫기 버튼은 숨긴다
const mainPanel = window.mainPanel = panel({ title: '설정', width: 640, height: 820, resizable: true, hidden: true }, p => {
  p.text('위쪽을 끌어서 옮기고, 가장자리를 끌어서 크기를 바꿔요.', { muted: true, small: true });
  p.section('표시', s => { s.switch('어두운 화면', { value: true }); s.slider('투명도', { min: 0, max: 100, value: 80, unit: '%' }); });
  p.section('계정', { collapsible: true }, s => { s.field('이메일', { placeholder: 'name@example.com', icon: 'fa-regular fa-envelope' }); s.button({ text: '로그아웃', variant: 'ghost' }); });
});
</script>
</body>
</html>
